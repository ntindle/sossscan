version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift this once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node's types follow the runtime: Node 24 (package.json engines, Dockerfile).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
